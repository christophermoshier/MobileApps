<script>
'use strict';
/* =====================================================================
   MOSHIER PARANORMAL — a neon ghost-wrangling game. All art drawn in code.
   ===================================================================== */

// ---------- utils ----------
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const pick = a => a[Math.floor(Math.random() * a.length)];
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeIn = t => t * t;
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function mixHex(a, b, t) {
  const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16);
  const r = Math.round(lerp(A >> 16, B >> 16, t)), g = Math.round(lerp((A >> 8) & 255, (B >> 8) & 255, t)), bl = Math.round(lerp(A & 255, B & 255, t));
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + bl).toString(16).slice(1);
}
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const LS = {
  get(k, d) { try { const v = localStorage.getItem('mp_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('mp_' + k, JSON.stringify(v)); } catch (e) { } }
};
const FONT = '"Avenir Next Condensed","Futura","Roboto Condensed","sans-serif-condensed","Arial Narrow","Arial Black",Impact,sans-serif';
const font = (px, w = 900) => `${w} ${Math.round(px)}px ${FONT}`;
function vib(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) { } }

// ---------- canvas & layout ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 390, H = 844, DPR = 1, S = 1, SAFE_T = 0, SAFE_B = 0;
let HUD_H, GROUND_Y, PLAY_TOP, PLAY_BOT, AIM_OFF, HY, LAKE_Y, GRID_Y;
let Q = 2; // render quality: 2 full glow, 1 reduced, 0 minimal

function readSafe() {
  const cs = getComputedStyle(document.getElementById('safe'));
  SAFE_T = parseFloat(cs.paddingTop) || 0; SAFE_B = parseFloat(cs.paddingBottom) || 0;
}
function resize() {
  readSafe();
  const vw = window.innerWidth, vh = window.innerHeight;
  H = vh; W = Math.min(vw, Math.round(vh * 0.68));
  DPR = Math.min(window.devicePixelRatio || 1, Q === 2 ? 2 : Q === 1 ? 1.6 : 1.2);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  S = Math.min(W / 390, H / 740);
  HUD_H = SAFE_T + 76 * S;
  GROUND_Y = H - SAFE_B - 44 * S;
  PLAY_TOP = HUD_H + 18 * S;
  PLAY_BOT = GROUND_Y - 165 * S;
  AIM_OFF = clamp(H * 0.1, 64, 110);
  HY = Math.round(H * 0.58);
  LAKE_Y = HY + 30 * S;
  GRID_Y = LAKE_Y + 52 * S;
  buildBG();
}

// ---------- perf / quality manager ----------
const perf = { acc: 0, n: 0, low: 0, fps: 60 };
function perfTick(dt) {
  perf.acc += dt; perf.n++;
  if (perf.acc >= 1.5) {
    perf.fps = perf.n / perf.acc; perf.acc = 0; perf.n = 0;
    if (G.state === 'play' && perf.fps < 47) { perf.low++; } else perf.low = 0;
    if (perf.low >= 2 && Q > 0) { Q--; perf.low = 0; resize(); }
  }
}

// ---------- audio (Web Audio synth) ----------
const AU = {
  ctx: null, muted: LS.get('muted', false), song: null, step: 0, nextT: 0,
  init() {
    if (this.ctx) { if (this.ctx.state !== 'running') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { }
    const c = this.ctx = new AC();
    this.master = c.createGain(); this.master.gain.value = this.muted ? 0 : 0.9;
    const comp = c.createDynamicsCompressor(); comp.threshold.value = -12; comp.knee.value = 10; comp.ratio.value = 5; comp.attack.value = 0.003; comp.release.value = 0.2;
    this.master.connect(comp); comp.connect(c.destination);
    this.mus = c.createGain(); this.mus.gain.value = 0.4; this.mus.connect(this.master);
    this.fx = c.createGain(); this.fx.gain.value = 0.85; this.fx.connect(this.master);
    this.rev = c.createConvolver(); this.rev.buffer = this.impulse(2.2, 3);
    const rg = c.createGain(); rg.gain.value = 0.32; this.rev.connect(rg); rg.connect(this.master);
    const len = c.sampleRate, nb = c.createBuffer(1, len, c.sampleRate), d = nb.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = nb;
    const s = c.createBufferSource(); s.buffer = c.createBuffer(1, 1, 22050); s.connect(c.destination); s.start(0);
    c.resume();
    this.initBeam();
    this.nextT = c.currentTime + 0.1;
    setInterval(() => this.sched(), 25);
  },
  impulse(sec, decay) {
    const c = this.ctx, len = Math.floor(c.sampleRate * sec), b = c.createBuffer(2, len, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = b.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
    return b;
  },
  setMuted(m) { this.muted = m; LS.set('muted', m); if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.9, this.ctx.currentTime, 0.03); },
  now() { return this.ctx ? this.ctx.currentTime : 0; },
  ok() { return this.ctx && this.ctx.state === 'running'; },
  tone(f, t, dur, o = {}) {
    const c = this.ctx; if (!c) return;
    const osc = c.createOscillator(); osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(f, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.slide), t + (o.slideT || dur));
    if (o.detune) osc.detune.value = o.detune;
    const g = c.createGain(), a = o.a || 0.005, v = o.v == null ? 0.2 : o.v;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + a);
    if (o.sus) g.gain.setValueAtTime(v, t + dur * 0.7);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let n = osc;
    if (o.lp || o.hp || o.bp) {
      const fl = c.createBiquadFilter(); fl.type = o.lp ? 'lowpass' : o.hp ? 'highpass' : 'bandpass';
      const fv = o.lp || o.hp || o.bp; fl.frequency.value = fv; fl.Q.value = o.q || 1;
      if (o.fenv) { fl.frequency.setValueAtTime(o.fenv, t); fl.frequency.exponentialRampToValueAtTime(fv, t + dur * 0.6); }
      n.connect(fl); n = fl;
    }
    n.connect(g); g.connect(o.dest || this.fx);
    if (o.rev) { const sg = c.createGain(); sg.gain.value = o.rev; g.connect(sg); sg.connect(this.rev); }
    osc.start(t); osc.stop(t + dur + 0.05);
    return osc;
  },
  noise(t, dur, o = {}) {
    const c = this.ctx; if (!c) return;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    const fl = c.createBiquadFilter(); fl.type = o.type || 'highpass'; fl.frequency.value = o.f || 1000; fl.Q.value = o.q || 0.7;
    if (o.fslide) { fl.frequency.setValueAtTime(o.f || 1000, t); fl.frequency.exponentialRampToValueAtTime(o.fslide, t + dur); }
    const g = c.createGain(), v = o.v == null ? 0.2 : o.v;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + (o.a || 0.002)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(o.dest || this.fx);
    if (o.rev) { const sg = c.createGain(); sg.gain.value = o.rev; g.connect(sg); sg.connect(this.rev); }
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  },
  // --- music ---
  SONGS: {
    title: { bpm: 92, prog: [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]], kick: [0, 8], snare: [4, 12], hat: [2, 6, 10, 14], arp: 1 },
    play: { bpm: 118, prog: [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]], kick: [0, 4, 8, 12], snare: [4, 12], hat: [2, 6, 10, 14], hat16: 1, arp: 1, lead: 1 },
    boss: { bpm: 134, prog: [[52, 55, 59], [53, 57, 60], [52, 55, 59], [50, 53, 57]], kick: [0, 3, 6, 8, 11, 14], snare: [4, 12], hat: [2, 6, 10, 14], hat16: 1, arp: 1, dark: 1 },
    over: { bpm: 76, prog: [[57, 60, 64], [53, 57, 60], [50, 53, 57], [52, 56, 59]], kick: [0], snare: [], hat: [8], arp: 0 },
    jam: { bpm: 120, prog: [[45, 52, 57], [48, 55, 60], [50, 57, 62], [43, 50, 55]], kick: [0, 6, 8, 10], snare: [4, 12], hat: [0, 2, 4, 6, 8, 10, 12, 14], hat16: 1, arp: 0, guitar: 1 }
  },
  LEAD: [76, 74, 72, 74, 76, 79, 76, 74, 72, 71, 72, 74, 71, 67, 69, 71],
  intensity: 0,
  play(name) { if (this.song === name) return; this.song = name; this.step = 0; if (this.ctx) this.nextT = this.ctx.currentTime + 0.06; },
  sched() {
    const c = this.ctx; if (!c || !this.song || c.state !== 'running') return;
    const SG = this.SONGS[this.song], spb = 60 / SG.bpm / 4;
    if (this.nextT < c.currentTime) this.nextT = c.currentTime + 0.05;
    while (this.nextT < c.currentTime + 0.12) { this.playStep(SG, this.step, this.nextT, spb); this.nextT += spb; this.step++; }
  },
  beatTime(stepsAhead) { return this.nextT; },
  playStep(SG, step, t, spb) {
    const s = step % 16, bar = Math.floor(step / 16) % SG.prog.length, ch = SG.prog[bar], M = this.mus;
    const m = f => 440 * Math.pow(2, (f - 69) / 12);
    if (SG.kick.includes(s)) this.kick(t);
    if (SG.snare.includes(s)) this.snare(t);
    if (SG.hat.includes(s)) this.noise(t, 0.05, { f: 7500, v: 0.1, dest: M });
    if (SG.hat16 && s % 2 === 1) this.noise(t, 0.025, { f: 9000, v: 0.04, dest: M });
    if (s % 2 === 0) { const n = ch[0] - 24 + (s % 4 === 2 ? 12 : 0); this.tone(m(n), t, spb * 1.8, { type: 'sawtooth', v: 0.2, lp: SG.dark ? 520 : 760, q: 4, fenv: 2200, dest: M }); }
    if (SG.arp) { const pat = [0, 1, 2, 1, 0, 2, 1, 2], n = ch[pat[s % 8]] + 12 + (s >= 8 ? 12 : 0); this.tone(m(n), t, spb * 0.9, { type: 'square', v: 0.045, lp: 2600, dest: M, rev: 0.2 }); }
    if (s === 0) for (const n of ch) this.tone(m(n), t, spb * 16, { type: 'sawtooth', v: 0.03, a: 0.3, sus: 1, lp: 1100, detune: rand(-9, 9), dest: M, rev: 0.4 });
    if (SG.lead && this.intensity > 0 && s % 2 === 0) { const n = this.LEAD[(Math.floor(step / 2)) % 16]; this.tone(m(n), t, spb * 1.6, { type: 'sawtooth', v: 0.05 * Math.min(1, this.intensity), lp: 3000, dest: M, rev: 0.35, detune: 6 }); }
    if (SG.guitar && [0, 3, 6, 10, 12].includes(s)) { const n = ch[(s / 3 | 0) % 3] + 12; this.tone(m(n), t, spb * 1.4, { type: 'square', v: 0.07, bp: 1400, q: 1.2, dest: M, rev: 0.2 }); this.tone(m(n + 7), t, spb * 1.4, { type: 'sawtooth', v: 0.04, lp: 2200, dest: M }); }
    if (this.onStep) this.onStep(step, t, spb);
  },
  kick(t) { const c = this.ctx, o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.13); g.gain.setValueAtTime(0.85, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.32); o.connect(g); g.connect(this.mus); o.start(t); o.stop(t + 0.35); },
  snare(t) { this.noise(t, 0.2, { type: 'bandpass', f: 1900, q: 0.8, v: 0.35, dest: this.mus, rev: 0.5 }); this.tone(190, t, 0.1, { type: 'triangle', v: 0.22, dest: this.mus }); },
  // --- beam drone ---
  initBeam() {
    const c = this.ctx, g = this.beamG = c.createGain(); g.gain.value = 0; g.connect(this.fx);
    const bp = this.beamF = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 700; bp.Q.value = 2; bp.connect(g);
    const o1 = this.beamO1 = c.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 58; o1.connect(bp);
    const o2 = this.beamO2 = c.createOscillator(); o2.type = 'square'; o2.frequency.value = 117; const g2 = c.createGain(); g2.gain.value = 0.5; o2.connect(g2); g2.connect(bp);
    const lfo = c.createOscillator(); lfo.frequency.value = 11; const lg = c.createGain(); lg.gain.value = 350; lfo.connect(lg); lg.connect(bp.frequency);
    const ns = c.createBufferSource(); ns.buffer = this.noiseBuf; ns.loop = true; const nh = c.createBiquadFilter(); nh.type = 'highpass'; nh.frequency.value = 2500;
    const ng = this.beamN = c.createGain(); ng.gain.value = 0.3; ns.connect(nh); nh.connect(ng); ng.connect(g);
    o1.start(); o2.start(); lfo.start(); ns.start();
    this.beamOn = false;
  },
  beam(on, power) {
    if (!this.ctx || !this.beamG) return;
    const t = this.ctx.currentTime;
    if (on !== this.beamOn) { this.beamG.gain.setTargetAtTime(on ? 0.15 : 0, t, on ? 0.02 : 0.04); this.beamOn = on; }
    if (on) {
      this.beamO1.frequency.setTargetAtTime(58 * (1 + power * 0.9), t, 0.05);
      this.beamO2.frequency.setTargetAtTime(117 * (1 + power * 0.9) + 3, t, 0.05);
      this.beamN.gain.setTargetAtTime(0.12 + Math.random() * 0.4, t, 0.01);
    }
  }
};
const SFX = {
  t() { return AU.now(); },
  click() { if (!AU.ctx) return; AU.tone(660, this.t(), 0.06, { type: 'square', v: 0.1 }); },
  lock() { if (!AU.ctx) return; const t = this.t(); AU.tone(700, t, 0.09, { type: 'square', v: 0.1, slide: 1600 }); },
  ready() { if (!AU.ctx) return; const t = this.t(); AU.tone(1320, t, 0.12, { type: 'triangle', v: 0.2 }); AU.tone(1760, t + 0.06, 0.18, { type: 'triangle', v: 0.18 }); },
  trap(m) {
    if (!AU.ctx) return; const t = this.t();
    AU.noise(t, 0.35, { type: 'bandpass', f: 3000, fslide: 300, v: 0.3, q: 2 });
    AU.tone(1200, t, 0.35, { type: 'sawtooth', v: 0.1, slide: 150, lp: 3000 });
    AU.tone(110, t + 0.3, 0.22, { type: 'sine', v: 0.5, slide: 50 });
    const base = [523, 659, 784, 1047, 1319];
    for (let i = 0; i < Math.min(5, 1 + m); i++) AU.tone(base[i], t + 0.3 + i * 0.055, 0.2, { type: 'square', v: 0.07, rev: 0.3 });
  },
  escape() { if (!AU.ctx) return; const t = this.t(); AU.tone(500, t, 0.3, { type: 'triangle', v: 0.14, slide: 1400 }); AU.tone(520, t + 0.08, 0.3, { type: 'triangle', v: 0.1, slide: 1700 }); },
  hit() { if (!AU.ctx) return; const t = this.t(); AU.tone(130, t, 0.45, { type: 'sawtooth', v: 0.35, slide: 40, lp: 700 }); AU.noise(t, 0.35, { type: 'lowpass', f: 900, v: 0.5 }); },
  splat() { if (!AU.ctx) return; const t = this.t(); AU.noise(t, 0.28, { type: 'lowpass', f: 1400, fslide: 180, v: 0.5, q: 4 }); AU.tone(320, t, 0.16, { type: 'sine', v: 0.3, slide: 70 }); },
  zap() { if (!AU.ctx) return; const t = this.t(); AU.noise(t, 0.15, { type: 'bandpass', f: 2500, v: 0.3, q: 3 }); AU.tone(900, t, 0.12, { type: 'square', v: 0.08, slide: 300 }); },
  burp() {
    const c = AU.ctx; if (!c) return; const t = c.currentTime;
    const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(105, t); o.frequency.exponentialRampToValueAtTime(52, t + 0.9);
    const l = c.createOscillator(); l.frequency.value = 27; const lg = c.createGain(); lg.gain.value = 22; l.connect(lg); lg.connect(o.frequency);
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 480; f.Q.value = 6;
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.6, t + 0.05); g.gain.setValueAtTime(0.5, t + 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.95);
    o.connect(f); f.connect(g); g.connect(AU.fx); o.start(t); l.start(t); o.stop(t + 1); l.stop(t + 1);
    AU.noise(t, 0.8, { type: 'lowpass', f: 350, v: 0.25 });
  },
  cackle() { if (!AU.ctx) return; const t = this.t(); for (let i = 0; i < 6; i++) { const f = 470 - i * 22; AU.tone(f, t + i * 0.13, 0.11, { type: 'sawtooth', v: 0.18, bp: 1100, q: 3, slide: f * 0.78, rev: 0.35 }); } },
  bark() { if (!AU.ctx) return; const t = this.t(); for (let i = 0; i < 2; i++) { const t0 = t + i * 0.17; AU.tone(640, t0, 0.09, { type: 'sawtooth', v: 0.28, bp: 1400, q: 2, slide: 980 }); AU.noise(t0, 0.06, { type: 'bandpass', f: 2200, v: 0.2 }); } },
  overheat() { if (!AU.ctx) return; const t = this.t(); AU.noise(t, 0.7, { type: 'highpass', f: 3000, fslide: 500, v: 0.3 }); AU.tone(320, t, 0.5, { type: 'square', v: 0.1, slide: 70 }); },
  combo(n) { if (!AU.ctx) return; const t = this.t(), sc = [0, 4, 7, 12, 16, 19]; for (let i = 0; i < 4; i++) AU.tone(523 * Math.pow(2, (sc[i] + n) / 12), t + i * 0.05, 0.14, { type: 'square', v: 0.07, rev: 0.4 }); },
  power() { if (!AU.ctx) return; const t = this.t(); AU.tone(110, t, 0.8, { type: 'sawtooth', v: 0.25, slide: 1800, lp: 4000 }); AU.noise(t, 0.8, { type: 'bandpass', f: 400, fslide: 6000, v: 0.3 }); AU.tone(880, t + 0.6, 0.5, { type: 'square', v: 0.1, rev: 0.6 }); },
  bossIn() { if (!AU.ctx) return; const t = this.t(); AU.tone(55, t, 1.2, { type: 'sawtooth', v: 0.4, lp: 400, q: 6 }); AU.tone(58, t, 1.2, { type: 'sawtooth', v: 0.3, lp: 400 }); },
  win() { if (!AU.ctx) return; const t = this.t(); [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => AU.tone(f, t + i * 0.1, i === 6 ? 0.6 : 0.14, { type: 'square', v: 0.09, rev: 0.4 })); },
  lose() { if (!AU.ctx) return; const t = this.t(); [392, 370, 349, 311].forEach((f, i) => AU.tone(f, t + i * 0.32, 0.4, { type: 'sawtooth', v: 0.15, lp: 1200, slide: f * 0.94, rev: 0.4 })); },
  ring() { if (!AU.ctx) return; const t = this.t(); for (let i = 0; i < 6; i++) AU.tone(i % 2 ? 1320 : 1660, t + i * 0.08, 0.07, { type: 'sine', v: 0.15 }); },
  unlock() { if (!AU.ctx) return; const t = this.t(); [392, 523, 659, 784, 1047, 1568].forEach((f, i) => AU.tone(f, t + i * 0.07, 0.2, { type: 'square', v: 0.1, rev: 0.5 })); },
  coin() { if (!AU.ctx) return; const t = this.t(); AU.tone(988, t, 0.08, { type: 'square', v: 0.12 }); AU.tone(1319, t + 0.07, 0.3, { type: 'square', v: 0.12, rev: 0.3 }); }
};

// ---------- glow sprites ----------

  SFX.win(); AU.play('title');
}
function nextRound() {
  startRound(G.round + 1);
}
function gameOver() {
  if (G.state === 'over') return;
  beam.down = false; beamOff(false);
  G.state = 'over'; G.st = 0; AU.play('over'); SFX.lose(); vib([100, 60, 200]);
  quip('over');
  if (G.score > G.best && !G.cheat) { G.best = G.score; LS.set('best', G.best); G.newBest = true; } else G.newBest = false;
  onGameOverHook();
}
function onGameOverHook() { }

// ---------- update ----------
function update(dt) {
  G.t += dt; G.st += dt;
  buttons.length = 0;
  if (G.paused) return;
  G.shake = Math.max(0, G.shake - dt * 40); G.flash = Math.max(0, G.flash - dt * 2);
  updateParts(dt); updateBubbles(dt);
  if (G.state === 'intro') { updatePlayer(dt); if (G.st > 1.6) beginPlay(); }
  else if (G.state === 'play') {
    const gdt = G.slow > 0 ? dt * 0.45 : dt;
    G.timer -= dt; G.comboT += dt; G.slow = Math.max(0, G.slow - dt); G.gold = Math.max(0, (G.gold || 0) - dt); G.shieldT = Math.max(0, (G.shieldT || 0) - dt);
    if (G.comboT > 4 && G.combo > 0) { G.combo = 0; AU.intensity = 0; }
    updatePlayer(dt); updateBeam(dt); updateSpawns(dt);
    for (const g of ghosts) updateGhost(g, g.state === 'caught' || g.state === 'trapping' ? dt : gdt);
    for (let i = ghosts.length - 1; i >= 0; i--) if (ghosts[i].dead) ghosts.splice(i, 1);
    updateBoss(dt); updateGlobs(dt); updateSplats(dt);
    playHooks(dt);
    if (G.timer <= 0 && G.state === 'play') endRound();
  } else {
    updatePlayer(dt);
    for (const g of ghosts) updateGhost(g, dt);
    for (let i = ghosts.length - 1; i >= 0; i--) if (ghosts[i].dead) ghosts.splice(i, 1);
    if (boss) updateBoss(dt);
    updateSplats(dt);
    otherHooks(dt);
  }
}
function playHooks(dt) { }
function otherHooks(dt) { }

// ---------- render ----------
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const sh = G.shake > 0 ? G.shake * S * 0.6 : 0;
  ctx.save();
  if (sh) ctx.translate(rand(-sh, sh), rand(-sh, sh));
  ctx.drawImage(bgC, 0, 0, W, H);
  drawBGAnim(G.t);
  const st = G.state;
  if (st === 'boot' || st === 'title') { ctx.restore(); drawTitle(); drawFlash(); return; }
  if (st === 'select') { ctx.restore(); drawSelect(); drawFlash(); return; }
  if (boss) drawBoss();
  for (const g of ghosts) drawGhost(g);
  drawGlobs();
  drawTrap();
  drawPlayer();
  drawFingerGuide();
  drawBeam();
  drawParts();
  drawSplats();
  ctx.restore();
  drawBubbles();
  if (st === 'play' || st === 'intro' || st === 'clear' || st === 'over') drawHUD();
  if (G.hint && st === 'play') drawHint();
  drawOverlays();
  if (st === 'intro') drawIntro();
  if (st === 'clear') drawClear();
  if (st === 'over') drawOver();
  if (G.paused) drawPause();
  drawFlash();
  if (DEBUG) { ctx.font = font(11 * S, 700); ctx.fillStyle = '#0f0'; ctx.textAlign = 'left'; ctx.fillText(`${perf.fps.toFixed(0)}fps Q${Q} p${parts.length}`, 8, H - 8); }
}
function drawOverlays() { }
function drawFlash() { if (G.flash > 0) { ctx.fillStyle = rgba(G.flashCol, G.flash * 0.6); ctx.fillRect(0, 0, W, H); } }
function panel(x, y, w, h) {
  ctx.fillStyle = 'rgba(14,2,36,0.86)'; rr(ctx, x, y, w, h, 18 * S); ctx.fill();
  setGlow('#ff3cc8', 18 * S); ctx.strokeStyle = '#ff3cc8'; ctx.lineWidth = 2.5 * S; ctx.stroke(); noGlow();
  ctx.strokeStyle = 'rgba(79,243,255,0.5)'; ctx.lineWidth = 1 * S; rr(ctx, x + 5 * S, y + 5 * S, w - 10 * S, h - 10 * S, 14 * S); ctx.stroke();
}
function drawLogo(cxp, cy, sc) {
  ctx.save(); ctx.translate(cxp, cy); ctx.scale(sc, sc); ctx.transform(1, 0, -0.12, 1, 0, 0);
  ctx.font = font(64 * S); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const g = ctx.createLinearGradient(0, -34 * S, 0, 30 * S);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.45, '#bfe9ff'); g.addColorStop(0.5, '#3a2a7a'); g.addColorStop(0.75, '#ff7ad9'); g.addColorStop(1, '#ffffff');
  ctx.lineWidth = 9 * S; ctx.strokeStyle = '#1a0236'; ctx.lineJoin = 'round'; ctx.strokeText('MOSHIER', 0, 0);
  setGlow('#4ff3ff', 24 * S); ctx.fillStyle = g; ctx.fillText('MOSHIER', 0, 0); noGlow();
  ctx.lineWidth = 1.5 * S; ctx.strokeStyle = '#ffffff'; ctx.strokeText('MOSHIER', 0, 0);
  ctx.font = font(34 * S, 800);
  const wob = Math.sin(G.t * 3) * 2 * S;
  ctx.lineWidth = 7 * S; ctx.strokeStyle = '#1a0236'; ctx.strokeText('PARANORMAL', 0, 50 * S + wob);
  setGlow('#ff3cc8', 22 * S); ctx.fillStyle = '#ff5fe0'; ctx.fillText('PARANORMAL', 0, 50 * S + wob); noGlow();
  // slime drips off the logo
  ctx.fillStyle = '#7dff3a';
  for (let i = 0; i < 5; i++) { const dx = (-110 + i * 55) * S, ph = (G.t * 0.4 + i * 0.29) % 1, len = 6 * S + ph * 26 * S; ctx.fillRect(dx - 2.5 * S, 66 * S, 5 * S, len); ctx.beginPath(); ctx.arc(dx, 66 * S + len, 4 * S, 0, TAU); ctx.fill(); }
  ctx.fillRect(-130 * S, 64 * S, 260 * S, 4 * S);

}
function drawTitle() {
  const s = S;
  // peeking Gloop
  const gy = H * 0.62 + Math.sin(G.t * 1.5) * 10 * s;
  if (!boss || boss.n !== -1) boss = { x: W * 0.5, y: gy, r: 58 * s, t: G.t, squish: 0.05, mouth: Math.sin(G.t * 2) > 0.7 ? 1 : 0, state: 'title', n: -1, ready: false, hp: 1, max: 1 };
  boss.y = gy; boss.t = G.t; boss.mouth = Math.max(0, Math.sin(G.t * 1.3) * 1.5 - 0.5);
  drawBoss();
  drawLogo(W / 2, H * 0.26, Math.min(1, W / (330 * s)));
  ctx.font = font(13 * s, 800); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(10,0,30,0.6)'; rr(ctx, W * 0.1, H * 0.26 + 84 * s, W * 0.8, 40 * s, 10 * s); ctx.fill();
  ctx.fillStyle = '#9ffcff'; ctx.fillText('CLARKSTON’S #1 (AND ONLY)', W / 2, H * 0.26 + 96 * s);
  ctx.fillText('FAMILY-OWNED GHOST WRANGLERS', W / 2, H * 0.26 + 112 * s);
  if (G.state === 'boot') {
    const k = Math.min(1, G.st / 1.4), bw = W * 0.6;
    ctx.fillStyle = 'rgba(255,255,255,0.15)'; rr(ctx, (W - bw) / 2, H * 0.8, bw, 10 * s, 5 * s); ctx.fill();
    ctx.fillStyle = '#ff3cc8'; rr(ctx, (W - bw) / 2, H * 0.8, Math.max(0.01, bw * k), 10 * s, 5 * s); ctx.fill();
    ctx.font = font(12 * s, 800); ctx.fillStyle = '#fff'; ctx.fillText('LOADING SPOOKS...', W / 2, H * 0.8 - 14 * s);
  } else {
    const a = 0.55 + 0.45 * Math.sin(G.t * 5);
    ctx.globalAlpha = a; neonText('TAP TO START', W / 2, H * 0.8, 30 * s, '#ffffff', { glow: '#4ff3ff' }); ctx.globalAlpha = 1;
    if (G.best > 0) { ctx.font = font(13 * s, 800); ctx.fillStyle = '#ffd23f'; ctx.fillText('HIGH SCORE ' + G.best.toLocaleString(), W / 2, H * 0.8 + 32 * s); }
  }
  drawJoke(H * 0.9);
  hudButtons();
}
function drawJoke(y) {
  if (!G.joke) return;
  ctx.font = font(13 * S, 700); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const lines = wrapText('DAD JOKE: ' + G.joke, W * 0.84);
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  lines.forEach((l, i) => ctx.fillText(l, W / 2, y + i * 17 * S));
}
function drawSelect() { }
function drawHint() {
  const s = S, t = G.st % 2.2, k = Math.min(1, t / 1.2);
  const fx = W / 2 + 30 * s, fy = lerp(GROUND_Y - 40 * s, GROUND_Y - 140 * s, easeOut(k));
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.ellipse(fx, fy, 11 * s, 15 * s, -0.2, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ffd8b0'; ctx.fillRect(fx - 8 * s, fy + 8 * s, 16 * s, 30 * s);
  ctx.globalAlpha = 1;
  const hy = PLAY_BOT + 30 * s;
  panel(W * 0.06, hy, W * 0.88, 52 * s);
  ctx.font = font(14 * s, 800); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
  ctx.fillText('DRAG to aim (beam fires ABOVE your thumb)', W / 2, hy + 18 * s);
  ctx.fillStyle = '#ffd23f'; ctx.fillText('HOLD on a ghost → LET GO to trap it!', W / 2, hy + 36 * s);
}
function drawIntro() {
  const k = G.st / 1.6, s = S;
  const x = k < 0.25 ? lerp(-W, W / 2, easeOutBack(k / 0.25)) : k > 0.8 ? lerp(W / 2, W * 2, easeIn((k - 0.8) / 0.2)) : W / 2;
  neonText(G.cfg.boss ? 'BOSS ROUND' : 'ROUND ' + G.round, x, H * 0.38, 46 * s, G.cfg.boss ? '#7dff3a' : '#ffffff', { glow: G.cfg.boss ? '#7dff3a' : '#ff3cc8' });
  ctx.font = font(15 * s, 800); ctx.fillStyle = '#9ffcff'; ctx.textAlign = 'center';
  const sub = G.cfg.boss ? 'GLOOP IS ON THE MENU' : ['', 'WARM-UP LAP', 'THINGS GET ZIPPY', '', 'LURKERS IN THE MIST', 'FULL MARATHON MODE'][G.round] || 'IT ONLY GETS WORSE';
  ctx.fillText(sub, x, H * 0.38 + 38 * s);
}
function drawClear() {
  const s = S, w = W * 0.86, h = 330 * s, x = (W - w) / 2, y = H * 0.18;
  const k = Math.min(1, G.st / 0.35); ctx.save(); ctx.translate(W / 2, y + h / 2); ctx.scale(easeOutBack(k), easeOutBack(k)); ctx.translate(-W / 2, -(y + h / 2));
  panel(x, y, w, h);
  neonText(G.bossWon ? 'GLOOP TRAPPED!' : 'ROUND ' + G.round + ' CLEAR!', W / 2, y + 36 * s, 30 * s, G.bossWon ? '#7dff3a' : '#4ff3ff');
  const rows = [['GHOSTS TRAPPED', G.roundTrapped], ['TRAP INTEGRITY BONUS', '+' + G.lastBonus.hp], ['NO-HIT BONUS', G.lastBonus.noHit ? '+1000' : '—'], ['SCORE', G.score.toLocaleString()]];
  rows.push(...clearExtraRows());
  ctx.font = font(15 * s, 800);
  rows.forEach((r, i) => { const yy = y + 78 * s + i * 26 * s; ctx.textAlign = 'left'; ctx.fillStyle = '#d9c8ff'; ctx.fillText(r[0], x + 22 * s, yy); ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.fillText(String(r[1]), x + w - 22 * s, yy); });
  ctx.restore();
  ctx.font = font(12 * s, 800); ctx.fillStyle = '#ff9be8'; ctx.textAlign = 'center'; ctx.fillText('LOADING ROUND ' + (G.round + 1) + '...', W / 2, y + h - 74 * s);
  ctx.textBaseline = 'middle';
  ctx.font = font(13 * s, 700); ctx.fillStyle = 'rgba(255,255,255,0.85)';
  const lines = wrapText('“' + G.joke + '”', w - 40 * s); lines.forEach((l, i) => ctx.fillText(l, W / 2, y + h - 52 * s + i * 16 * s));
  if (G.st > 1) { ctx.globalAlpha = 0.6 + 0.4 * Math.sin(G.t * 5); neonText('TAP TO CONTINUE', W / 2, y + h + 34 * s, 22 * s, '#fff', { glow: '#4ff3ff' }); ctx.globalAlpha = 1; }
}
function clearExtraRows() { return []; }
function drawOver() {
  const s = S, k = Math.min(1, G.st / 0.6);
  ctx.fillStyle = `rgba(5,0,15,${0.55 * k})`; ctx.fillRect(0, 0, W, H);
  const y = lerp(-80 * s, H * 0.3, easeOutBack(k));
  neonText('GAME OVER', W / 2, y, 52 * s, '#7dff3a', { glow: '#3aff00' });
  ctx.fillStyle = '#7dff3a';
  for (let i = 0; i < 7; i++) { const dx = W / 2 + (-120 + i * 40) * s, len = Math.min(1, G.st / 2) * (20 + (i * 37) % 40) * s; ctx.fillRect(dx - 3 * s, y + 18 * s, 6 * s, len); ctx.beginPath(); ctx.arc(dx, y + 18 * s + len, 5 * s, 0, TAU); ctx.fill(); }
  ctx.font = font(16 * s, 800); ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  ctx.fillText('THE TRAP IS TOAST.', W / 2, y + 80 * s);
  neonText(G.score.toLocaleString(), W / 2, y + 125 * s, 44 * s, '#ffffff', { glow: '#ff3cc8' });
  if (G.newBest) neonText('NEW HIGH SCORE!', W / 2, y + 165 * s, 20 * s, '#ffd23f');
  else { ctx.font = font(14 * s, 800); ctx.fillStyle = '#ffd23f'; ctx.fillText('BEST ' + G.best.toLocaleString(), W / 2, y + 165 * s); }
  if (G.st > 1.2) { ctx.globalAlpha = 0.6 + 0.4 * Math.sin(G.t * 5); neonText('TAP TO PLAY AGAIN', W / 2, H * 0.78, 24 * s, '#fff', { glow: '#4ff3ff' }); ctx.globalAlpha = 1; }
}
function drawPause() {
  ctx.fillStyle = 'rgba(5,0,15,0.7)'; ctx.fillRect(0, 0, W, H);
  neonText('PAUSED', W / 2, H * 0.4, 48 * S, '#fff', { glow: '#4ff3ff' });
  ctx.font = font(15 * S, 800); ctx.fillStyle = '#9ffcff'; ctx.textAlign = 'center'; ctx.fillText('TAP TO RESUME', W / 2, H * 0.4 + 44 * S);
  hudButtons();
}

// ---------- input ----------
function pt(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function hitBtn(p) { for (let i = buttons.length - 1; i >= 0; i--) { const b = buttons[i]; if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) return b; } return null; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  AU.init();
  const p = pt(e);
  const b = hitBtn(p); if (b) { SFX.click(); b.fn(); return; }
  if (G.paused) { G.paused = false; return; }
  onTap(p, e);
}, { passive: false });
cv.addEventListener('pointermove', e => { if (beam.down && e.pointerId === beam.pid) { const p = pt(e); beam.fx = p.x; beam.fy = p.y; } }, { passive: true });
function up(e) { if (beam.down && e.pointerId === beam.pid) { beam.down = false; beam.pid = null; if (beam.on) beamOff(true); } }
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', e => { if (e.pointerId === beam.pid) { beam.down = false; beam.pid = null; beamOff(false); } });
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
function onTap(p, e) {
  switch (G.state) {
    case 'title': SFX.coin(); toSelect(); break;
    case 'select': selectTap(p); break;
    case 'play':
      if (!beam.down) { beam.down = true; beam.pid = e.pointerId; beam.fx = p.x; beam.fy = p.y; try { cv.setPointerCapture(e.pointerId); } catch (er) { } }
      break;
    case 'clear': if (G.st > 1) { SFX.click(); nextRound(); } break;
    case 'over': if (G.st > 1.2) { SFX.click(); overTap(p); } break;
    default: otherTap(p, e);
  }
}
function toSelect() { startGame(); }
function selectTap(p) { }
function overTap(p) { G.state = 'title'; G.st = 0; G.joke = nextJoke(); boss = null; clearField(); AU.play('title'); }
function otherTap(p, e) { }

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (G.state === 'play') { G.paused = true; beam.down = false; beamOff(false); } if (AU.ctx) AU.ctx.suspend(); }
  else if (AU.ctx) AU.ctx.resume();
});
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

// ---------- main loop ----------
const DEBUG = /debug/.test(location.search);
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.25) dt = 1 / 60; else perfTick(dt);
  dt = Math.min(dt, 1 / 30);
  if (G.state === 'boot' && G.st > 1.4) { G.state = 'title'; G.st = 0; }
  update(dt); render();
}
// ---------- PWA: home-screen icon drawn in code + offline worker ----------
function makeTouchIcon() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180; const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 0, 180); g.addColorStop(0, '#1a0540'); g.addColorStop(1, '#b0157a'); x.fillStyle = g; x.fillRect(0, 0, 180, 180);
    x.fillStyle = '#7dff3a'; x.beginPath(); x.arc(90, 92, 52, 0, TAU); x.fill(); x.fillRect(48, 92, 84, 50);
    x.fillStyle = '#fff'; x.beginPath(); x.arc(72, 84, 14, 0, TAU); x.arc(110, 80, 10, 0, TAU); x.fill();
    x.fillStyle = '#140022'; x.beginPath(); x.arc(75, 87, 6, 0, TAU); x.arc(112, 83, 5, 0, TAU); x.fill();
    x.fillStyle = '#0a3d0e'; x.beginPath(); x.ellipse(92, 116, 20, 10, 0, 0, TAU); x.fill();
    x.font = '900 26px ' + FONT; x.textAlign = 'center'; x.fillStyle = '#fff'; x.fillText('MOSHIER', 90, 30);
    const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = c.toDataURL('image/png'); document.head.appendChild(l);
  } catch (e) { }
}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });

resize();
makeTouchIcon();
G.joke = nextJoke();
window.__MP = { G, ghosts, beam, player, get boss() { return boss; }, spawnGhost, startRound, AU, splats };
requestAnimationFrame(frame);
</script>
